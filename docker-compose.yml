# KnowledgeEnroll Development Stack
# Target: Banner (10.0.0.33)
# Port Block: 5000-5099
#
# External Services (already running on Banner):
# - PostgreSQL: knowledge-postgres on 10.0.0.33:5019
# - SurrealDB: knowledgestack-surrealdb on 10.0.0.33:5040

services:
  # Admin API (Flask)
  # Connects to external PostgreSQL (knowledge-postgres on 5019)
  admin-api:
    deploy:
      resources:
        limits:
          memory: 256M
    build: ./src/admin
    container_name: knowledge-admin-api
    restart: unless-stopped
    environment:
      KNOWLEDGE_DB_HOST: knowledge-postgres
      KNOWLEDGE_DB_PORT: 5432
      KNOWLEDGE_DB_NAME: knowledge
      KNOWLEDGE_DB_USER: knowledge
      KNOWLEDGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      # Fallback only — proxied routes report their prefix per-request via
      # X-Forwarded-Prefix (set by the stripprefix middlewares below), so the
      # same container serves /admin, /enroll, and direct port access.
      URL_PREFIX: ""
      SURREAL_URL: http://10.0.0.33:5040
      SURREAL_USER: root
      SURREAL_PASS: ${SURREAL_PASS:-changeme}
      SURREAL_NS: knowledge
      SURREAL_DB: transcripts
      TRANSCRIPT_DIR: /data/transcripts
      EMBEDDING_SERVICE_URL: http://knowledge-embedding:5030
      # yt-dlp lives in the transcript-service container, so the downloader
      # component of /api/v1/status is answered by asking that service rather
      # than by inspecting this container, which has no downloader on it.
      TRANSCRIPT_SERVICE_URL: http://knowledge-transcript-service:5025
    ports:
      - "5020:5020"
    volumes:
      # Read-only: /api/v1/status reports corpus size and freshness from the
      # files themselves, which is the only check that catches a stalled ingest.
      - /mnt/foundry_resources/transcripts:/data/transcripts:ro
    labels:
      - "traefik.enable=true"
      # Canonical: knowledge.nextlevelfoundry.com/admin/
      - "traefik.http.routers.knowledge-admin.rule=Host(`knowledge.nextlevelfoundry.com`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.knowledge-admin.entrypoints=websecure"
      - "traefik.http.routers.knowledge-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.knowledge-admin.middlewares=admin-stripprefix"
      - "traefik.http.middlewares.admin-stripprefix.stripprefix.prefixes=/admin"
      - "traefik.http.services.knowledge-admin.loadbalancer.server.port=5020"
      # Alias: knowledge.nextlevelfoundry.com/enroll/ (same app; existing links,
      # health checks and n8n calls keep working)
      - "traefik.http.routers.knowledge-enroll.rule=Host(`knowledge.nextlevelfoundry.com`) && PathPrefix(`/enroll`)"
      - "traefik.http.routers.knowledge-enroll.entrypoints=websecure"
      - "traefik.http.routers.knowledge-enroll.tls.certresolver=letsencrypt"
      - "traefik.http.routers.knowledge-enroll.middlewares=enroll-stripprefix"
      - "traefik.http.middlewares.enroll-stripprefix.stripprefix.prefixes=/enroll"
      - "traefik.http.services.knowledge-enroll.loadbalancer.server.port=5020"
      # Legacy domain: permanent redirect to the canonical /admin path
      - "traefik.http.routers.knowledge-admin-legacy.rule=Host(`knowledge-admin.nextlevelguild.com`)"
      - "traefik.http.routers.knowledge-admin-legacy.entrypoints=websecure"
      - "traefik.http.routers.knowledge-admin-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.knowledge-admin-legacy.middlewares=admin-legacy-redirect"
      - "traefik.http.middlewares.admin-legacy-redirect.redirectregex.regex=https://knowledge-admin\\.nextlevelguild\\.com/(.*)"
      - "traefik.http.middlewares.admin-legacy-redirect.redirectregex.replacement=https://knowledge.nextlevelfoundry.com/admin/$${1}"
      - "traefik.http.middlewares.admin-legacy-redirect.redirectregex.permanent=true"
      - "traefik.http.services.knowledge-admin-legacy.loadbalancer.server.port=5020"

  # Embedding Service (Flask)
  # Connects to external SurrealDB (knowledgestack-surrealdb on 5040)
  embedding:
    deploy:
      resources:
        limits:
          memory: 256M
    build: ./src/embedding
    container_name: knowledge-embedding
    restart: unless-stopped
    environment:
      SURREAL_URL: http://10.0.0.33:5040
      SURREAL_USER: root
      SURREAL_PASS: ${SURREAL_PASS:-changeme}
      SURREAL_NS: knowledge
      SURREAL_DB: transcripts
      LITELLM_URL: ${LITELLM_URL:-http://10.0.0.27:2764/v1/embeddings}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Model-specific trio — MUST move together (see src/embedding/config.py).
      # jarvis-embed: dim 768, prefixes 'search_document: '/'search_query: '.
      # embeddings (OpenAI): dim 1536, no prefixes.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddings}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      EMBEDDING_DOC_PREFIX: ${EMBEDDING_DOC_PREFIX:-}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
    ports:
      - "5030:5030"
    labels:
      - "traefik.enable=true"
      # Primary: knowledge.nextlevelfoundry.com/ingest/
      - "traefik.http.routers.knowledge-ingest.rule=Host(`knowledge.nextlevelfoundry.com`) && PathPrefix(`/ingest`)"
      - "traefik.http.routers.knowledge-ingest.entrypoints=websecure"
      - "traefik.http.routers.knowledge-ingest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.knowledge-ingest.middlewares=ingest-stripprefix"
      - "traefik.http.middlewares.ingest-stripprefix.stripprefix.prefixes=/ingest"
      - "traefik.http.services.knowledge-ingest.loadbalancer.server.port=5030"
      # Legacy: keep old domain working during transition
      - "traefik.http.routers.knowledge-embedding-legacy.rule=Host(`knowledge-embedding.nextlevelguild.com`)"
      - "traefik.http.routers.knowledge-embedding-legacy.entrypoints=websecure"
      - "traefik.http.routers.knowledge-embedding-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.services.knowledge-embedding-legacy.loadbalancer.server.port=5030"

  # Transcript Service (Flask)
  # Fetches YouTube transcripts and discovers new videos for n8n workflows
  transcript-service:
    deploy:
      resources:
        limits:
          memory: 512M
    build: ./src/transcript-service
    container_name: knowledge-transcript-service
    restart: unless-stopped
    environment:
      TRANSCRIPT_DIR: /data/transcripts
      STATE_DIR: /data/state
      SERVICE_PORT: "5025"
      EMBEDDING_SERVICE_URL: http://knowledge-embedding:5030
      EMBED_ON_INGEST: ${EMBED_ON_INGEST:-true}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      KNOWLEDGE_DB_HOST: knowledge-postgres
      KNOWLEDGE_DB_PORT: 5432
      KNOWLEDGE_DB_NAME: knowledge
      KNOWLEDGE_DB_USER: knowledge
      KNOWLEDGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Empty by default: YouTube calls go out over our own connection, which is
      # residential and normally fine. Set via scripts/set-youtube-proxy.sh when
      # YouTube rate-limits us. Scoped to YouTube traffic only — deliberately not
      # HTTP_PROXY, which would push internal SurrealDB and embedding-service
      # calls through a metered third party too.
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
      WEBSHARE_PROXY_USERNAME: ${WEBSHARE_PROXY_USERNAME:-}
      WEBSHARE_PROXY_PASSWORD: ${WEBSHARE_PROXY_PASSWORD:-}
      WEBSHARE_PROXY_LOCATIONS: ${WEBSHARE_PROXY_LOCATIONS:-US}
      # 'transcript' (default) proxies only the blocked caption calls; 'all'
      # also tunnels yt-dlp's much larger metadata fetches. Residential proxies
      # bill per gigabyte, so the default keeps the meter on text only.
      YOUTUBE_PROXY_SCOPE: ${YOUTUBE_PROXY_SCOPE:-transcript}
      # Discovery had not run since 2026-03-22, leaving a real ~4.5-month
      # backlog of roughly 1,076 uploads across 51 channels (~4.7/channel/month,
      # which checks out). The default abort threshold of 500 is tuned to catch
      # a broken filter — a runaway looks like tens of thousands, not ~1k — so
      # it is raised here to let the genuine catch-up through. Drop it back to
      # the default once the queue has drained.
      DISCOVERY_MAX_NEW: "1500"
    ports:
      - "5025:5025"
    volumes:
      - /mnt/foundry_resources/transcripts:/data/transcripts
      - transcript_state:/data/state
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.knowledge-transcript.rule=Host(`knowledge.nextlevelfoundry.com`) && PathPrefix(`/transcript`)"
      - "traefik.http.routers.knowledge-transcript.entrypoints=websecure"
      - "traefik.http.routers.knowledge-transcript.tls.certresolver=letsencrypt"
      - "traefik.http.routers.knowledge-transcript.middlewares=transcript-stripprefix"
      - "traefik.http.middlewares.transcript-stripprefix.stripprefix.prefixes=/transcript"
      - "traefik.http.services.knowledge-transcript.loadbalancer.server.port=5025"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5025/health').status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Landing Page (nginx)
  # Root page at knowledge.nextlevelfoundry.com/
  landing:
    deploy:
      resources:
        limits:
          memory: 256M
    build: ./src/landing
    container_name: knowledge-landing
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      # Bind-mounted (not baked into the image) so editing docs/CONSUMER_GUIDE.md
      # updates https://knowledge.nextlevelfoundry.com/guide with no rebuild needed.
      - ./docs/CONSUMER_GUIDE.md:/usr/share/nginx/html/consumer-guide.md:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.knowledge-landing.rule=Host(`knowledge.nextlevelfoundry.com`) && !PathPrefix(`/admin`) && !PathPrefix(`/enroll`) && !PathPrefix(`/ingest`) && !PathPrefix(`/transcript`) && !PathPrefix(`/lecture`) && !PathPrefix(`/college`)"
      - "traefik.http.routers.knowledge-landing.entrypoints=websecure"
      - "traefik.http.routers.knowledge-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.knowledge-landing.loadbalancer.server.port=5000"

volumes:
  transcript_state:

networks:
  default:
    name: knowledge-network
    external: true
