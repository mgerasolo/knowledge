{% extends "base.html" %}
{% block title %}Channels - KnowledgeEnroll{% endblock %}

{% block content %}
<div class="flex flex-between flex-center mb-20">
    <h1>Channels</h1>
    <div class="flex gap-10">
        <button class="btn" onclick="openAddChannel()">Add Channel</button>
        <button class="btn btn-secondary" onclick="openEnrollVideo()">Enroll Video</button>
        <select id="filter-domain" class="form-select" style="width:150px" onchange="loadChannels()">
            <option value="">All Domains</option>
        </select>
        <select id="filter-mode" class="form-select" style="width:150px" onchange="loadChannels()">
            <option value="">All Modes</option>
            <option value="new_only">New Only</option>
            <option value="last_3_months">Last 3 Months</option>
            <option value="last_year">Last Year</option>
            <option value="all">All</option>
            <option value="selected">Selected</option>
        </select>
        <input type="text" id="search" class="form-input" placeholder="Search channels..." style="width:200px" oninput="debounceSearch()">
    </div>
</div>

<div id="add-channel-modal" role="dialog" aria-modal="true" aria-labelledby="add-channel-title" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;padding:40px;overflow-y:auto">
    <div style="max-width:560px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px;position:relative">
        <button type="button" aria-label="Close" onclick="closeAddChannel()" style="position:absolute;right:18px;top:14px;background:none;border:0;color:#94a3b8;font-size:1.6rem;cursor:pointer">&times;</button>
        <h2 id="add-channel-title">Add Channel</h2>
        <form id="add-channel-form" onsubmit="createChannel(event)">
            <div class="form-group"><label class="form-label" for="new-handle">YouTube Handle</label><input id="new-handle" class="form-input" required placeholder="@channel"><div id="handle-warning" class="status-error" style="display:none;margin-top:6px;font-size:0.85rem"></div></div>
            <div class="form-group"><label class="form-label" for="new-name">Name</label><input id="new-name" class="form-input" required></div>
            <div class="form-group"><label class="form-label">Domain</label><div id="new-domain-tags" class="flex gap-10" style="flex-wrap:wrap;margin-bottom:8px"></div><input id="new-domain" class="form-input" placeholder="New domain…" aria-label="New domain"></div>
            <div class="form-group"><label class="form-label" for="new-mode">Ingestion Mode</label><select id="new-mode" class="form-select"><option value="new_only" selected>New Only</option><option value="last_3_months">Last 3 Months</option><option value="last_year">Last Year</option><option value="all">All</option><option value="selected">Selected</option></select></div>
            <div class="form-group"><label class="form-label">Content Types</label><div class="flex gap-10" style="flex-wrap:wrap"><label><input id="new-include-videos" type="checkbox" checked> Videos</label><label><input id="new-include-lives" type="checkbox" checked> Lives</label><label><input id="new-include-shorts" type="checkbox" checked> Shorts</label></div></div>
            <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input id="new-active" type="checkbox" class="checkbox" checked> Active</label></div>
            <div id="add-channel-error" class="status-error" style="display:none;margin-bottom:12px"></div>
            <div class="flex gap-10"><button id="add-channel-submit" class="btn" type="submit">Add Channel</button><button class="btn btn-secondary" type="button" onclick="closeAddChannel()">Cancel</button></div>
        </form>
    </div>
</div>

<div id="enroll-video-modal" role="dialog" aria-modal="true" aria-labelledby="enroll-video-title" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;padding:40px">
    <div style="max-width:500px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px">
        <h2 id="enroll-video-title">Enroll Video</h2>
        <form onsubmit="enrollVideo(event)"><div class="form-group"><label class="form-label" for="enroll-video-url">YouTube URL</label><input id="enroll-video-url" class="form-input" required placeholder="https://youtube.com/watch?v=…"></div><div id="enroll-video-status" style="display:none;margin-bottom:12px"></div><div class="flex gap-10"><button class="btn" type="submit">Enroll</button><button class="btn btn-secondary" type="button" onclick="closeEnrollVideo()">Cancel</button></div></form>
    </div>
</div>

<div class="panel">
    <table>
        <thead>
            <tr>
                <th style="width:40%">Channel</th>
                <th>Domain</th>
                <th>Mode</th>
                <th>Videos</th>
                <th>Status</th>
                <th style="width:100px">Actions</th>
            </tr>
        </thead>
        <tbody id="channels-table">
            <tr><td colspan="6" class="loading"><div class="spinner"></div>Loading channels...</td></tr>
        </tbody>
    </table>
</div>

<div class="flex flex-between flex-center mt-20">
    <div id="pagination-info" style="color:#64748b"></div>
    <div class="flex gap-10">
        <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="prevPage()" disabled>Previous</button>
        <button class="btn btn-secondary btn-sm" id="next-btn" onclick="nextPage()">Next</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const urlPrefix = '{{ url_prefix }}';
let currentOffset = 0;
const limit = 25;
let searchTimeout;
let knownDomains = ['ai-tech', 'mindset', 'business', 'general', 'faith', 'political', 'health'];
let selectedNewDomain = '';
let resolvedChannelId = '';
let resolvedThumbnail = '';

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadChannels() {
    const domain = document.getElementById('filter-domain').value;
    const mode = document.getElementById('filter-mode').value;
    const search = document.getElementById('search').value;

    let url = urlPrefix + '/api/v1/channels?limit=' + limit + '&offset=' + currentOffset;
    if (domain) url += '&domain=' + encodeURIComponent(domain);
    if (mode) url += '&ingestion_mode=' + encodeURIComponent(mode);

    try {
        const data = await fetch(url).then(r => r.json());
        const tbody = document.getElementById('channels-table');
        tbody.replaceChildren();

        let channels = data.channels || [];
        if (search) {
            const s = search.toLowerCase();
            channels = channels.filter(c => (c.name || '').toLowerCase().includes(s) || (c.youtube_handle || '').toLowerCase().includes(s));
        }

        if (channels.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="6" class="empty-state"><h3>No channels found</h3></td>';
            tbody.appendChild(tr);
            return;
        }

        channels.forEach(c => {
            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.onclick = function() { window.location.href = urlPrefix + '/channels/' + c.id; };
            // Build HTML with escaped values
            const thumbUrl = escapeHtml(c.thumbnail_url || '');
            const name = escapeHtml(c.name || c.youtube_handle);
            const handle = escapeHtml(c.youtube_handle);
            const dom = escapeHtml(c.domain || 'Uncategorized');
            const ingMode = escapeHtml(c.ingestion_mode || 'new_only');
            const vcount = c.video_count || '-';
            const statusBadge = c.is_active ? 'active' : 'inactive';
            const statusText = c.is_active ? 'Active' : 'Inactive';
            tr.innerHTML = '<td><div class="channel-row"><img src="' + thumbUrl + '" class="thumbnail" onerror="this.style.display=\'none\'"><div class="channel-info"><div class="channel-name">' + name + '</div><div class="channel-handle">@' + handle + '</div></div></div></td><td><span class="topic-tag">' + dom + '</span></td><td><span class="badge badge-' + ingMode + '">' + ingMode + '</span></td><td>' + vcount + '</td><td><span class="badge badge-' + statusBadge + '">' + statusText + '</span></td><td onclick="event.stopPropagation()"><div class="flex gap-10"><button class="btn btn-sm btn-secondary" onclick="toggleChannel(\'' + c.id + '\', this)">' + (c.is_active ? 'Disable' : 'Enable') + '</button><a href="' + urlPrefix + '/channels/' + c.id + '" class="btn btn-sm btn-outline">View</a></div></td>';
            tbody.appendChild(tr);
        });

        document.getElementById('pagination-info').textContent = 'Showing ' + (currentOffset + 1) + '-' + (currentOffset + channels.length) + ' of ' + data.total;
        document.getElementById('prev-btn').disabled = currentOffset === 0;
        document.getElementById('next-btn').disabled = currentOffset + limit >= data.total;
    } catch (err) {
        console.error('Error loading channels:', err);
    }
}

async function loadDomains() {
    const stats = await fetch(urlPrefix + '/api/v1/channels/stats').then(r => r.json());
    const select = document.getElementById('filter-domain');
    stats.by_domain.forEach(d => {
        if (d.domain && !knownDomains.includes(d.domain)) knownDomains.push(d.domain);
        const opt = document.createElement('option');
        opt.value = d.domain || '';
        opt.textContent = (d.domain || 'Uncategorized') + ' (' + d.count + ')';
        select.appendChild(opt);
    });
    renderDomainTags('new-domain-tags', selectedNewDomain, function(domain) { selectedNewDomain = domain; document.getElementById('new-domain').value = ''; });
}

function renderDomainTags(containerId, selected, onSelect) {
    const container = document.getElementById(containerId);
    container.replaceChildren();
    knownDomains.forEach(domain => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-sm ' + (domain === selected ? '' : 'btn-secondary');
        button.textContent = domain;
        button.onclick = function() { onSelect(domain); renderDomainTags(containerId, domain, onSelect); };
        container.appendChild(button);
    });
}

function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(loadChannels, 300); }
function prevPage() { currentOffset = Math.max(0, currentOffset - limit); loadChannels(); }
function nextPage() { currentOffset += limit; loadChannels(); }

function openAddChannel() {
    document.getElementById('add-channel-modal').style.display = 'block';
    document.getElementById('new-handle').focus();
}

function closeAddChannel() {
    document.getElementById('add-channel-modal').style.display = 'none';
    document.getElementById('add-channel-error').style.display = 'none';
}

function openEnrollVideo() { document.getElementById('enroll-video-modal').style.display = 'block'; document.getElementById('enroll-video-url').focus(); }
function closeEnrollVideo() { document.getElementById('enroll-video-modal').style.display = 'none'; document.getElementById('enroll-video-status').style.display = 'none'; }

async function enrollVideo(event) {
    event.preventDefault();
    const status = document.getElementById('enroll-video-status');
    status.style.display = 'block'; status.className = ''; status.textContent = 'Queueing…';
    try {
        const response = await fetch(urlPrefix + '/api/v1/videos/enroll', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:document.getElementById('enroll-video-url').value.trim()})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not enroll video');
        status.className = 'status-success'; status.textContent = data.created ? 'Video queued.' : 'Video is already enrolled (' + data.status + ').';
        document.getElementById('enroll-video-url').value = '';
    } catch (err) { status.className = 'status-error'; status.textContent = err.message; }
}

async function createChannel(event) {
    event.preventDefault();
    const submit = document.getElementById('add-channel-submit');
    const error = document.getElementById('add-channel-error');
    submit.disabled = true;
    error.style.display = 'none';
    const payload = {
        youtube_handle: document.getElementById('new-handle').value.trim().replace(/^@/, ''),
        name: document.getElementById('new-name').value.trim(),
        domain: document.getElementById('new-domain').value.trim() || selectedNewDomain || 'general',
        ingestion_mode: document.getElementById('new-mode').value,
        is_active: document.getElementById('new-active').checked,
        include_videos: document.getElementById('new-include-videos').checked,
        include_lives: document.getElementById('new-include-lives').checked,
        include_shorts: document.getElementById('new-include-shorts').checked
    };
    if (resolvedChannelId) payload.youtube_channel_id = resolvedChannelId;
    if (resolvedThumbnail) payload.thumbnail_url = resolvedThumbnail;
    try {
        const response = await fetch(urlPrefix + '/api/v1/channels', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not add channel');
        const createdId = data.id;
        const mode = payload.ingestion_mode;
        document.getElementById('add-channel-form').reset();
        document.getElementById('new-active').checked = true;
        selectedNewDomain = ''; resolvedChannelId = ''; resolvedThumbnail = '';
        closeAddChannel();
        if (mode === 'selected') {
            // Selected means "I will pick the videos" — go straight to the
            // channel page where the picking happens.
            window.location.href = urlPrefix + '/channels/' + createdId;
            return;
        }
        if (['all', 'last_3_months', 'last_year'].includes(mode)) {
            // These modes promise the back catalog — start the import now
            // rather than waiting for someone to press Import Videos.
            fetch(urlPrefix + '/api/v1/channels/' + createdId + '/backfill', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({limit: 100})
            }).catch(function() { /* Discovery also picks the channel up hourly. */ });
        }
        currentOffset = 0;
        await loadChannels();
    } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
    } finally {
        submit.disabled = false;
    }
}

async function toggleChannel(channelId, button) {
    button.disabled = true;
    try {
        const response = await fetch(urlPrefix + '/api/v1/channels/' + channelId + '/toggle', {method: 'POST'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not update channel');
        await loadChannels();
    } catch (err) {
        alert('Error: ' + err.message);
        button.disabled = false;
    }
}

document.getElementById('add-channel-modal').addEventListener('click', function(event) {
    if (event.target === this) closeAddChannel();
});
document.getElementById('new-domain').addEventListener('input', function() { if (this.value.trim()) { selectedNewDomain = ''; renderDomainTags('new-domain-tags', '', function(domain) { selectedNewDomain = domain; document.getElementById('new-domain').value = ''; }); } });
// Name auto-fill tracking: a name WE filled may be replaced when the handle
// changes; a name the USER typed is never touched.
let nameWasAutofilled = false;
document.getElementById('new-name').addEventListener('input', function() { nameWasAutofilled = false; });

function setHandleWarning(text) {
    const warn = document.getElementById('handle-warning');
    warn.textContent = text || '';
    warn.style.display = text ? 'block' : 'none';
    document.getElementById('add-channel-submit').disabled = Boolean(text);
}

document.getElementById('new-handle').addEventListener('blur', async function() {
    const handle = this.value.trim();
    if (!handle) { setHandleWarning(''); return; }

    // Duplicate check against our own database first — warn at handle entry,
    // not after the whole form has been filled in.
    try {
        const dup = await fetch(urlPrefix + '/api/v1/channels/exists?handle=' + encodeURIComponent(handle)).then(r => r.json());
        if (dup.exists) {
            setHandleWarning('Already enrolled as "' + dup.name + '" — edit it from the channel list instead.');
            return;
        }
        setHandleWarning('');
    } catch (_) { setHandleWarning(''); }

    // Resolve the channel name from YouTube. Overwrite the Name field if it
    // is empty OR still holding a previous auto-fill — never a typed name.
    try {
        const response = await fetch(urlPrefix + '/api/v1/channels/resolve?handle=' + encodeURIComponent(handle));
        if (!response.ok) return;
        const data = await response.json();
        const name = document.getElementById('new-name');
        if (!name.value.trim() || nameWasAutofilled) {
            name.value = data.name || '';
            nameWasAutofilled = Boolean(data.name);
        }
        resolvedChannelId = data.youtube_channel_id || '';
        resolvedThumbnail = data.thumbnail_url || '';
    } catch (_) { /* Resolution is a convenience; manual entry remains available. */ }
});

loadDomains();
loadChannels();

// Deep links from the tier-2 nav: /channels?add=1 and /channels?enroll=1
const navParams = new URLSearchParams(window.location.search);
if (navParams.get('add') === '1') openAddChannel();
else if (navParams.get('enroll') === '1') openEnrollVideo();
</script>
{% endblock %}
